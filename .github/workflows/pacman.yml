name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Replace ghost sprites with Marceline
        run: |
          python3 - <<'EOF'
          import re, base64, glob

          def data_uri(path):
              with open(path, "rb") as f:
                  return "data:image/gif;base64," + base64.b64encode(f.read()).decode()

          sprites = {"left": data_uri("assets/ghost-left.gif"), "right": data_uri("assets/ghost-right.gif")}

          def swap(match):
              direction = match.group(2)
              href = sprites["left"] if direction == "left" else sprites["right"]
              return (
                  f'<symbol id="ghost-{match.group(1)}-{direction}" viewBox="0 0 20 20" overflow="visible">'
                  f'<image href="{href}" x="-5" y="-5" width="30" height="30"/>'
              )

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  svg = f.read()
              svg, count = re.subn(
                  r'<symbol id="ghost-(blinky|inky|pinky|clyde)-(up|down|left|right)"[^>]*>\s*<image [^>]*>',
                  swap,
                  svg,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
              print(f"Swapped {count} ghost sprites in {path}")
          EOF

      - name: Inline external images into SVG (fixes broken ghost icons)
        run: |
          python3 - <<'EOF'
          import re, base64, glob, urllib.request

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  svg = f.read()

              def inline_image(match):
                  attr, url = match.group(1), match.group(2)
                  if url.startswith("data:"):
                      return match.group(0)
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      data = urllib.request.urlopen(req, timeout=15).read()
                      mime = "image/png"
                      low = url.lower()
                      if low.endswith(".gif"):
                          mime = "image/gif"
                      elif low.endswith((".jpg", ".jpeg")):
                          mime = "image/jpeg"
                      elif low.endswith(".svg"):
                          mime = "image/svg+xml"
                      b64 = base64.b64encode(data).decode()
                      return f'{attr}="data:{mime};base64,{b64}"'
                  except Exception as e:
                      print(f"WARN: could not inline {url}: {e}")
                      return match.group(0)

              svg = re.sub(r'(xlink:href|href)="(https?://[^"]+)"', inline_image, svg)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
              print(f"Processed {path} ({len(svg)} bytes)")
          EOF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
